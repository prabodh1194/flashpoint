[project]
name = "gateway"
version = "0.1.0"
description = "Flashpoint gateway - minimal EC2 control plane for Fargate driver tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.18",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pyspark>=4.0.2",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "grpcio>=1.62.0",
    "grpcio-status>=1.62.0",
    "zstandard>=0.25.0",
    "boto3-stubs~=1.43.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "RUF", "PIE", "FURB"]
ignore = [
    "BLE001",
    "S110",
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "E402", "S", "W291"]
"dag.py" = ["E501"]
"reconcile.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.ty]
environment = { python-version = "3.12" }

